<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
<header><span class="wordmark">CONNECT.</span></header>
<main>
<section id="connections" aria-label="Соединения">
<div id="profiles" class="profiles"></div>
<p id="status" role="status" class="muted" hidden></p>
<button id="add" class="add"><span aria-hidden="true">+</span> Добавить</button>
</section>
<section id="editor" hidden>
<div class="editor-heading"><button id="back" aria-label="Назад" class="back">‹</button><h1>Добавить соединение</h1></div>
<form id="import">
<label for="link">Ссылка или конфигурация</label>
<textarea id="link" rows="4" spellcheck="false" autocomplete="off" placeholder="sudoku://, vless:// или JSON Mist" required maxlength="1048576"></textarea>
<p id="detected" class="detected" aria-live="polite"></p>
<label for="name">Название <span class="muted">· необязательно</span></label>
<input id="name" placeholder="Мой сервер" maxlength="120" autocomplete="off">
<button id="save" class="primary" type="submit">Добавить</button>
</form>
</section>
<p id="error" role="alert" hidden></p>
<button id="release" class="release" hidden>Отключить VPN</button>
</main>
<footer>Только Chrome</footer>
<script src="popup.js"></script>
</body></html>
