<!doctype html><html lang="ru"><meta charset="utf-8"><title>Connect · Настройки</title><link rel="stylesheet" href="style.css"><body class="settings"><header><span class="wordmark">CONNECT.</span></header><main><h1>Настройки</h1><p class="muted">Соединения Chrome хранятся отдельно от приложения Windows.</p><section><h2>Протокол</h2><nav id="protocols"><button data-protocol="sudoku">Sudoku</button><button data-protocol="xray">Xray</button><button data-protocol="mist">Mist</button></nav><div id="profiles"></div></section><section><h2>Добавить соединение</h2><form id="import"><label>Название<input id="name" maxlength="120" autocomplete="off" placeholder="Мой сервер"></label><label>Ссылка или конфигурация<textarea id="link" required rows="5" autocomplete="off" spellcheck="false" placeholder="sudoku://, vless://, vmess://, trojan://, mist:// или JSON Mist"></textarea></label><button class="primary">Добавить</button></form><p class="muted">Xray сохраняет параметры xhttp, включая host, path, mode и extra. Для Mist вставьте клиентский JSON.</p></section><p id="error" role="alert"></p><p id="message" role="status"></p></main><script src="settings.js"></script></body></html>
