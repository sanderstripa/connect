name: Installer review
on:
  pull_request:
    paths:
      - 'cmd/installer/**'
      - 'scripts/build-installer.ps1'
      - 'frontend/tests/installer.spec.ts'
      - 'frontend/playwright.installer.config.ts'
      - '.github/workflows/installer-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch exact published application payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $release=Invoke-RestMethod "https://api.github.com/repos/sanderstripa/connect/releases/tags/v$version"
          $asset=$release.assets | Where-Object name -eq 'Connect.exe'
          if(-not $asset -or $asset.digest -notmatch '^sha256:[a-f0-9]{64}$'){throw 'Missing verified release payload'}
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Invoke-WebRequest $asset.browser_download_url -OutFile build/bin/Connect.exe
          $hash=(Get-FileHash build/bin/Connect.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if(('sha256:'+$hash) -ne $asset.digest){throw 'Application payload hash mismatch'}
          "$hash  Connect.exe" | Set-Content build/bin/payload-sha256.txt
      - name: Test installer screens
        working-directory: frontend
        shell: pwsh
        env:
          CONNECT_PREVIEW_DIR: ${{ github.workspace }}/.tmp/installer-previews
        run: |
          npm ci
          if($LASTEXITCODE -ne 0){throw 'Dependencies failed'}
          npx playwright install chromium
          if($LASTEXITCODE -ne 0){throw 'Browser installation failed'}
          npx playwright test --config playwright.installer.config.ts
          if($LASTEXITCODE -ne 0){throw 'Installer screen tests failed'}
      - name: Build installer and run isolated native lifecycle tests
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -SkipApp
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
          $hash=(Get-FileHash build/bin/Connect-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Connect-Setup.exe" | Set-Content build/bin/installer-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CONNECT-Installer-Review
          path: |
            build/bin/Connect-Setup.exe
            build/bin/*sha256.txt
            .tmp/installer-previews/
          if-no-files-found: error
