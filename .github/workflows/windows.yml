name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[verified-promotion]')"
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Windows app and test core
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test native helper and extension lifecycle
        shell: pwsh
        run: |
          node scripts/verify-branding.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Branding verification failed' }
          ./scripts/verify-icon-alpha.ps1
          node scripts/test-extension.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension tests failed' }
          node scripts/test-native.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native integration tests failed' }
      - name: Test interface
        working-directory: frontend
        env:
          CONNECT_PREVIEW_DIR: ${{ github.workspace }}/.tmp/installer-previews
        shell: pwsh
        run: |
          npx playwright install chromium
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Interface tests failed' }
      - name: Verify actual Windows window icons
        shell: pwsh
        run: ./scripts/test-window-icon.ps1
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipApp
      - name: Verify compiled application and installer icons
        shell: pwsh
        run: |
          node scripts/verify-windows-icons.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Compiled icon verification failed' }
      - name: Verify shared installer themes, localisation and button alignment
        shell: pwsh
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/frontend/node_modules/playwright
        run: ./installer-core/test-ui.ps1 -OutputDirectory .tmp/installer-previews/shared
      - name: Test native installer window
        shell: pwsh
        run: ./scripts/test-installer-window.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-Installer-Screenshots
          path: .tmp/installer-previews/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-Windows-x64
          path: |
            build/bin/Connect.exe
            build/bin/Connect-Setup.exe
            build/bin/Connect-Chrome.zip
            build/bin/Connect-AmneziaWG-windows-amd64.zip
            build/bin/Connect-Sudoku-*-windows-amd64.zip
            build/bin/Connect-Setup.exe.build.json
            build/windows/icon.ico
            build/windows/installer.ico
            build/tray/tray-*.ico
          if-no-files-found: error
      - name: Publish verified release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag=(Get-Content .github/release-version -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag=$env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; preserving published binaries."; exit 0 }
          $version=$tag.TrimStart('v')
          $installer="build/bin/Connect-$version-Release-x64.exe"
          Copy-Item build/bin/Connect-Setup.exe $installer
          $portable="build/bin/Connect-$version-Release-x64.zip"
          Compress-Archive -Path build/bin/Connect.exe -DestinationPath $portable -Force
          $files=@($installer,$portable,'build/bin/Connect-Chrome.zip','build/bin/Connect-AmneziaWG-windows-amd64.zip')
          $files += @(Get-ChildItem build/bin/Connect-Sudoku-*-windows-amd64.zip | ForEach-Object { $_.FullName })
          if ($files.Count -ne 5) { throw 'Expected exactly one compatible Sudoku component' }
          $sums=foreach($file in $files){ "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content SHA256SUMS.txt -Encoding ascii
          gh release create $tag @files SHA256SUMS.txt --target $env:GITHUB_SHA --latest --title "Connect $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Verified release publication failed' }
