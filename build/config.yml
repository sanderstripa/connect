version: '3'

info:
  companyName: "sanderstripa"
  productName: "Connect"
  productIdentifier: "com.sanderstripa.connect"
  description: "Connect VPN for Windows"
  copyright: "(c) 2026, SUDOKU-ASCII"
  comments: "Connect"
  version: "0.3.1"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 800
  ignore:
    dir:
      - .git
      - node_modules
      - frontend/node_modules
      - frontend/dist
      - build/bin
    file:
      - .DS_Store
    watched_extension:
      - "*.go"
      - "*.ts"
      - "*.js"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run:nobuild
      type: primary

fileAssociations: []
other:
  - name: runtime
